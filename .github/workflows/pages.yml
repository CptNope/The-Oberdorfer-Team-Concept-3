# Publishes the site to GitHub Pages (Settings → Pages → Source: GitHub Actions).
# Only the files visitors need are deployed. The repo-only material (source/
# print PDF, tools/, docs/, Markdown, design-tool files) stays out of the
# artifact so deploys stay small and fast.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assemble the published site
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -r assets discovery brand-book design-system site decisions coming-soon _site/
          # The current WordPress build (same zips as the latest GitHub release), at a stable URL
          # that the staging site can download from: wordpress/oberdorfer.zip and wordpress/ot-core.zip.
          python3 tools/build_wp.py
          mkdir -p _site/wordpress
          cp wordpress/dist/oberdorfer.zip wordpress/dist/ot-core.zip wordpress/release.json _site/wordpress/
          echo "Published size:" && du -sh _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
