<!-- @dsCard group="Forms" height=277 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>FormField</title></head>
<body class="pv-body">
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true"><symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7V13M12 16V17"/></symbol></svg>
<div class="pv">
<div class="block__body ds-states">
<div class="field"><label class="field__label" for="s1">Default</label><input class="input" id="s1" placeholder="Your full name"/></div>
<div class="field"><label class="field__label" for="s2">Focus</label><input class="input" id="s2" style="border-color:var(--input-border-focus);box-shadow:0 0 0 1px var(--input-border-focus),0 0 0 4px color-mix(in srgb,var(--ot-gold) 35%,transparent)" value="Kaitlyn"/></div>
<div class="field field--error"><label class="field__label" for="s3">Error</label><input aria-describedby="s3e" aria-invalid="true" class="input" id="s3" value="kaitlyn@"/><p class="field__error" id="s3e"><svg aria-hidden="true" class="icon"><use href="#i-alert"></use></svg><span>Enter an email address like name@example.com.</span></p></div>
<div class="field field--success"><label class="field__label" for="s4">Valid</label><input class="input" id="s4" value="(406) 250-7620"/></div>
<div class="field"><label class="field__label" for="s5">Disabled</label><input class="input" disabled="" id="s5" value="Assigned automatically"/></div>
<div class="field"><label class="field__label" for="s6">Select</label><select class="select" id="s6"><option>I'm buying</option><option>I'm selling</option><option>Both</option></select></div>
</div>
</div>
</body>
</html>
