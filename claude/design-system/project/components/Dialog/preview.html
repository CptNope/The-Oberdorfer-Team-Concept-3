<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Dialog</title></head>
<body class="pv-body">
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true"><symbol id="i-close" viewBox="0 0 24 24"><path d="M5 5L19 19M19 5L5 19"/></symbol></svg>
<div class="pv">
<div class="block__body"><button class="btn" data-dialog-open="ds-dialog" type="button">Open the dialog</button>
<dialog aria-labelledby="ds-dialog-title" class="dialog" id="ds-dialog" open style="position:static;margin:var(--space-5) 0 0;animation:none"><div class="dialog__inner"><div class="dialog__head"><p class="h3" id="ds-dialog-title">Save this search?</p><button aria-label="Close" class="icon-btn dialog__close" data-dialog-close="" type="button"><svg aria-hidden="true" class="icon"><use href="#i-close"></use></svg></button></div><p class="body-s">We will email you when a new home matches Wakefield, 3+ beds, up to $900k. No account needed.</p><div class="field"><label class="field__label" for="ds-dlg-email">Email</label><input autocomplete="email" class="input" id="ds-dlg-email" type="email"/></div><div class="dialog__actions"><button class="btn btn--secondary" data-dialog-close="" type="button">Cancel</button><button class="btn" data-dialog-close="" data-icons="../assets/img/icons.svg" data-toast="Search saved (demonstration)." type="button">Save search</button></div></div></dialog></div>
</div>
</body>
</html>
