<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Alert</title></head>
<body class="pv-body">
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true"><symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7V13M12 16V17"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="M4.5 12.5L9.5 17.5L19.5 6.5"/></symbol><symbol id="i-close" viewBox="0 0 24 24"><path d="M5 5L19 19M19 5L5 19"/></symbol><symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11V17M12 7V8"/></symbol></svg>
<div class="pv">
<div class="block__body"><div class="stack">
<div class="alert alert--info" role="note"><svg aria-hidden="true" class="icon"><use href="#i-info"></use></svg><div><strong>Market figures are historical.</strong><p>Wakefield, data through August 2026 (Redfin).</p></div><button aria-label="Dismiss" class="alert__close" data-dismiss="" type="button"><svg aria-hidden="true" class="icon"><use href="#i-close"></use></svg></button></div>
<div class="alert alert--success" role="status"><svg aria-hidden="true" class="icon"><use href="#i-check"></use></svg><div><strong>Search saved.</strong><p>We will let you know when a match is listed.</p></div><button aria-label="Dismiss" class="alert__close" data-dismiss="" type="button"><svg aria-hidden="true" class="icon"><use href="#i-close"></use></svg></button></div>
<div class="alert alert--warning" role="note"><svg aria-hidden="true" class="icon"><use href="#i-alert"></use></svg><div><strong>Open house time changed.</strong><p>Sunday, 1–3 PM (demonstration).</p></div><button aria-label="Dismiss" class="alert__close" data-dismiss="" type="button"><svg aria-hidden="true" class="icon"><use href="#i-close"></use></svg></button></div>
<div class="alert alert--error" role="alert"><svg aria-hidden="true" class="icon"><use href="#i-alert"></use></svg><div><strong>We couldn't load listings.</strong><p>Check your connection and try again, or call 406-250-7620.</p></div><button aria-label="Dismiss" class="alert__close" data-dismiss="" type="button"><svg aria-hidden="true" class="icon"><use href="#i-close"></use></svg></button></div>
</div></div>
</div>
</body>
</html>
